<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Loveridge Properties</title>
  <link rel="icon" href="/icons/icon-192x192.png">
  <meta name="theme-color" content="#064e3b">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #022c22;
      color: #f0fdf4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(6, 78, 59, 0.6);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
    }
    .logo {
      height: 48px;
      margin-bottom: 24px;
      object-fit: contain;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(16, 185, 129, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #a7f3d0;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background: #10b981;
      color: #022c22;
      font-weight: 700;
      font-size: 14px;
      border-radius: 9999px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #34d399;
    }
    .contact {
      margin-top: 20px;
      font-size: 12px;
      color: #6ee7b7;
    }
    .contact a {
      color: #ffffff;
      text-decoration: underline;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo-white.png" alt="Loveridge" class="logo">
    <div class="icon">📶</div>
    <h1>You're Currently Offline</h1>
    <p>It looks like your internet connection is temporarily unavailable. Cached listings remain viewable when available.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="contact">
      Urgent Assistance: <a href="tel:+233246432493">+233 24 643 2493</a>
    </div>
  </div>
</body>
</html>
